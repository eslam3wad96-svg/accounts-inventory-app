name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: |
          mkdir source
          unzip -o accounts_inventory_source.zip -d source
          flutter create . --platforms android --org com.accounts.inventory
          cp source/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r source/lib lib

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: accounts-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
