name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: |
          mkdir source
          unzip -o accounts_inventory_source.zip -d source
          flutter create . --project-name accounts_inventory_app --platforms android --org com.accounts.inventory
          cp source/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r source/lib lib
          
      -      - name: Fix source syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/lib/main.dart")
          s = p.read_text()

          old = """   Expanded(child:ListView.builder(itemCount:rows.length,itemBuilder:(_,i){final r=rows[i];return Card(child:ListTile(title:Text(r['name']),subtitle:Text(r['phone']??''),leading:CircleAvatar(child:Text('${i+1}')),trailing:PopupMenuButton<String>(onSelected:(v)async{if(v=='edit')await edit(r);if(v=='delete'){await DB.delete(widget.type=='customer'?'customers':'suppliers',r['id']);setState((){});}},itemBuilder:(_)=>const[PopupMenuItem(value:'edit',child:Text('تعديل')),PopupMenuItem(value:'delete',child:Text('حذف'))]),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>Statement(id:r['id'],name:r['name'],type:widget.type))));})), """

          new = """   Expanded(
      child: ListView.builder(
        itemCount: rows.length,
        itemBuilder: (_, i) {
          final r = rows[i];
          return Card(
            child: ListTile(
              title: Text(r['name']),
              subtitle: Text(r['phone'] ?? ''),
              leading: CircleAvatar(child: Text('${i + 1}')),
              trailing: PopupMenuButton<String>(
                onSelected: (v) async {
                  if (v == 'edit') await edit(r);
                  if (v == 'delete') {
                    await DB.delete(
                      widget.type == 'customer' ? 'customers' : 'suppliers',
                      r['id'],
                    );
                    setState(() {});
                  }
                },
                itemBuilder: (_) => const [
                  PopupMenuItem(value: 'edit', child: Text('تعديل')),
                  PopupMenuItem(value: 'delete', child: Text('حذف')),
                ],
              ),
              onTap: () => Navigator.push(
                c,
                MaterialPageRoute(
                  builder: (_) => Statement(
                    id: r['id'],
                    name: r['name'],
                    type: widget.type,
                  ),
                ),
              ),
            ),
          );
        },
      ),
    ), """

          if old not in s:
              raise SystemExit("Expected source block was not found")

          s = s.replace(old, new)

          s = s.replace(
              "onSelectionChanged:(v)=>setState(()=>{kind=v.first;party=null;item=null;})",
              "onSelectionChanged:(v){setState((){kind=v.first;party=null;item=null;});}"
          )

          p.write_text(s)
          PY
        run: |
          sed -i "s/type:widget.type))));})),/type:widget.type)))));})),/" source/lib/main.dart
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: accounts-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
